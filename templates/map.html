{% extends "layout.html" %}
{% block content %}

<h3>Attack World Map</h3>
<div id="map" style="height:400px;"></div>

<script>

// Demo marker (replace with real IP later)
L.marker([28.6,77.2]).addTo(map)
.bindPopup("Attack Source").openPopup();

{% endblock %}
